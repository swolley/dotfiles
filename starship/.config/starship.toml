"$schema" = 'https://starship.rs/config-schema.json'

# Noctalia green powerline — screenshot layout:
# username → directory → runtimes → time (soft surfaces, not teal/yellow)
format = """
$username\
[](bg:accent fg:surface)\
$directory\
[](fg:accent bg:surface)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:surface bg:surface2)\
$docker_context\
$time\
[ ](fg:surface2)"""

palette = 'noctalia_soft'

[palettes.noctalia_soft]
accent = "#8fbf98"
text = "#d8ddd9"
muted = "#7a827c"
urgent = "#ffb4ab"
red = "#ffb4ab"
yellow = "#c6a26e"
base = "#1c1c1e"
surface = "#2a2b2e"
surface2 = "#3a3b3e"

[os]
disabled = true

[username]
show_always = true
style_user = "bg:surface fg:text"
style_root = "bg:surface fg:urgent"
format = '[ $user ]($style)'

[directory]
style = "fg:base bg:accent"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
disabled = true

[git_status]
disabled = true

[nodejs]
symbol = ""
style = "bg:surface"
format = '[[ $symbol( $version) ](fg:text bg:surface)]($style)'

[c]
symbol = " "
style = "bg:surface"
format = '[[ $symbol( $version) ](fg:text bg:surface)]($style)'

[rust]
symbol = ""
style = "bg:surface"
format = '[[ $symbol( $version) ](fg:text bg:surface)]($style)'

[golang]
symbol = ""
style = "bg:surface"
format = '[[ $symbol( $version) ](fg:text bg:surface)]($style)'

[php]
symbol = ""
style = "bg:surface"
format = '[[ $symbol( $version) ](fg:text bg:surface)]($style)'

[java]
symbol = " "
style = "bg:surface"
format = '[[ $symbol( $version) ](fg:text bg:surface)]($style)'

[kotlin]
symbol = ""
style = "bg:surface"
format = '[[ $symbol( $version) ](fg:text bg:surface)]($style)'

[haskell]
symbol = ""
style = "bg:surface"
format = '[[ $symbol( $version) ](fg:text bg:surface)]($style)'

[python]
symbol = ""
style = "bg:surface"
format = '[[ $symbol( $version) ](fg:text bg:surface)]($style)'

[docker_context]
symbol = ""
style = "bg:surface2"
format = '[](fg:surface bg:surface2)[ $symbol( $context) ](fg:text bg:surface2)'

[time]
disabled = false
time_format = "%R"
style = "bg:surface2"
format = '[[  $time ](fg:text bg:surface2)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[](bold fg:accent)'
error_symbol = '[](bold fg:urgent)'
vimcmd_symbol = '[](bold fg:accent)'
vimcmd_replace_one_symbol = '[](bold fg:muted)'
vimcmd_replace_symbol = '[](bold fg:muted)'
vimcmd_visual_symbol = '[](bold fg:text)'
