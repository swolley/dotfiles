"$schema" = 'https://starship.rs/config-schema.json'

# Connected powerline: carets between segments, rounded only at the end.
# Runtime versions (node/php/…) come from a script so caret colors always match.
format = """
$username\
[](bg:accent fg:surface)\
$directory\
[](fg:accent bg:surface2)\
${custom.runtimes}\
$docker_context\
$time\
[ ](fg:surface2)"""

palette = 'noctalia_soft'

[palettes.noctalia_soft]
accent = "#8fbf98"
text = "#d8ddd9"
muted = "#7a827c"
urgent = "#ffb4ab"
red = "#ffb4ab"
yellow = "#c6a26e"
base = "#1c1c1e"
surface = "#2a2b2e"
surface2 = "#3a3b3e"

[os]
disabled = true

[username]
show_always = true
style_user = "bg:surface fg:text"
style_root = "bg:surface fg:urgent"
format = '[ $user ]($style)'

[directory]
style = "fg:base bg:accent"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
disabled = true

[git_status]
disabled = true

# Built by runtimes.sh — ANSI powerline with correct caret colors
[custom.runtimes]
command = "~/.config/starship/runtimes.sh"
when = true
shell = ["bash", "--noprofile", "--norc"]
format = "$output"
ignore_timeout = true
description = "Alternating gray runtime versions"

# Only when docker context is active; continues into time (surface2)
[docker_context]
symbol = ""
style = "bg:surface"
format = '[](fg:surface2 bg:surface)[ $symbol( $context) ](fg:text bg:surface)[](fg:surface bg:surface2)'

[time]
disabled = false
time_format = "%R"
style = "bg:surface2"
format = '[  $time ](fg:text bg:surface2)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[](bold fg:accent)'
error_symbol = '[](bold fg:urgent)'
vimcmd_symbol = '[](bold fg:accent)'
vimcmd_replace_one_symbol = '[](bold fg:muted)'
vimcmd_replace_symbol = '[](bold fg:muted)'
vimcmd_visual_symbol = '[](bold fg:text)'
