# ~/.config/lazygit/config.yml
# lazygit 0.65.x

gui:
  theme:
    activeBorderColor:
      - "#8fbf98"
      - bold
    inactiveBorderColor:
      - "#36363a"
    searchingActiveBorderColor:
      - "#ffffff"
      - bold
    optionsTextColor:
      - "#c0bfbc"
    selectedLineBgColor:
      - "#38383d"
    inactiveViewSelectedLineBgColor:
      - bold
    cherryPickedCommitFgColor:
      - "#c0bfbc"
    cherryPickedCommitBgColor:
      - "#ffffff"
    markedBaseCommitFgColor:
      - "#ffffff"
    markedBaseCommitBgColor:
      - "#c01c28"
    unstagedChangesColor:
      - "#c01c28"
    defaultFgColor:
      - "#ffffff"
  nerdFontsVersion: "3" # you have AdwaitaMono Nerd Font: icons enabled
  showFileTree: true # files as a tree instead of a flat list (toggle: `
  showRandomTip: false
  showCommandLog: false # more room for the panels; reopen it with @
  showBottomLine: true
  expandFocusedSidePanel: true # the focused panel expands by itself
  mainPanelSplitMode: flexible
  scrollHeight: 2
  mouseEvents: true
  skipDiscardChangeWarning: false
  skipStashWarning: false
os:
  editPreset: "nvim" # `e` and long rewords open nvim (not nano)
git:
  parseEmoji: true # renders :emoji: in messages
  autoFetch: true # automatic background fetch
  fetchAll: true
  diffRenderers:
    - colorArg: always
      # DELTA is not installed. After `sudo pacman -S git-delta` uncomment
      # the two lines below for side-by-side diffs and syntax highlighting:
      # pager: delta --dark --paging=never --line-numbers
      # useConfig: false

      type: rawGit
# General behavior
disableStartupPopups: true # no version popups at startup
promptToReturnFromSubprocess: false # does not ask to "press enter" after each command
quitOnTopLevelReturn: false

# Example: bind your own commands to a key. Uncomment and adapt.
