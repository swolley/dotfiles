# Electron sceglie il portachiavi in base a XDG_CURRENT_DESKTOP: sotto niri
# non riconosce l'ambiente e ripiega su un archivio in chiaro, segnalando
# che manca il keyring. Qui lo forziamo su quello vero, gia' attivo via
# gnome-keyring-daemon (org.freedesktop.secrets).
--password-store=gnome-libsecret
