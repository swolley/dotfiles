set-option -g default-command "/usr/bin/zsh"
set-option -g default-shell "/usr/bin/zsh"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g set-clipboard on         # Use system clipboard
set -g detach-on-destroy off    # Don't exit from tmux when closing a session
set -g escape-time 0            # Remove delay for exiting insert mode with ESC in Neovim
set -g mouse on                 # Enable mouse support
set -g status-interval 3        # Update the status bar every 3 seconds (default: 15 seconds)
set -g allow-passthrough on     # Allow programs in the pane to bypass tmux (e.g. for image preview)
set -g status-position top

set -g prefix C-s

set-window-option -g mode-keys vi

unbind r
bind r source-file ~/.tmux.conf
# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Split / new window: keep current pane path (not $HOME)
unbind '"'
bind _ split-window -h -c "#{pane_current_path}"
unbind %
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

set-window-option -g mode-keys vi

# copy and paste
# Start selecting text with "v"
bind-key -T copy-mode-vi 'v' send -X begin-selection 

# Copy text with "y" - sync with system clipboard
# Try OSC 52 first (works with modern terminals), fallback to xclip/wl-copy if available
bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "tmux show-buffer | xclip -selection clipboard 2>/dev/null || tmux show-buffer | wl-copy 2>/dev/null || tmux show-buffer"

# Paste from system clipboard with "Prefix + p" (without auto-enter)
# Use external script for better performance (linked by stow in ~/bin/)
unbind p
unbind n
bind p run-shell "$HOME/.tmux/bin/tmux-paste.sh" \; display-message "Pasted from clipboard"

# Ctrl+Shift+V to paste from system clipboard (works like normal terminal, without auto-enter)
# Note: Ctrl+Shift+C is handled by the terminal itself when selecting text
bind-key -n C-S-v run-shell "$HOME/.tmux/bin/tmux-paste.sh" \; display-message "Pasted from clipboard"

# Mouse: copy on selection (automatically copy when selecting with mouse)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard 2>/dev/null || wl-copy 2>/dev/null || cat"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on # Automatically renumber windows when one is closed

# TPM must be the first
set -g @plugin 'tmux-plugins/tpm'

# List of plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum'    # Automatically saves sessions every 15 minutes
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-yank'         # Better clipboard integration

# Soft noctalia green palette (icon capsules with Nerd Font glyphs)
bgcolor="#1c1c1e"
fgcolor="#d8ddd9"
accent="#8fbf98"
surface="#2a2b2e"
surface2="#3a3b3e"
muted="#7a827c"
urgent="#ffb4ab"
yellow="#c6a26e"
teal="#7eb8b0"

set -g status-style "bg=${bgcolor},fg=${fgcolor}"
set -g message-style "bg=${surface},fg=${accent}"
set -g message-command-style "bg=${surface},fg=${accent}"
set -g mode-style "bg=${surface2},fg=${fgcolor}"
set -g pane-border-style "fg=${surface2}"
set -g pane-active-border-style "fg=${accent}"

set -g status-left-length 40
# Long enough so gitmux is not clipped (tmux truncates status-right from the left)
set -g status-right-length 200

# Status modules:  + colored Nerd Font icon + text on surface
# Layout (L→R): gitmux · application · cpu · session
set -g status-left ""
set -g status-right "#[fg=${teal}]#[fg=${bgcolor},bg=${teal}]󰊢 #[fg=${fgcolor},bg=${surface}] #(gitmux -cfg $HOME/.gitmux.conf \"#{pane_current_path}\") "
set -ag status-right "#[fg=${urgent}]#[fg=${bgcolor},bg=${urgent}] #[fg=${fgcolor},bg=${surface}] #{pane_current_command} "
set -ag status-right "#[fg=${yellow}]#[fg=${bgcolor},bg=${yellow}] #[fg=${fgcolor},bg=${surface}] #{cpu_percentage} "
set -ag status-right "#[fg=${accent}]#[fg=${bgcolor},bg=${accent}] #[fg=${fgcolor},bg=${surface}] #S "

# Rounded window pills: number badge + name (light pad after #I only)
set -g window-status-separator " "
set -g window-status-format "#[fg=${surface2}]#[fg=${muted},bg=${surface2}]#I #[fg=${muted},bg=${surface}] #W #[fg=${surface},bg=${bgcolor}]"
set -g window-status-current-format "#[fg=${accent}]#[fg=${bgcolor},bg=${accent},bold]#I #[fg=${fgcolor},bg=${surface2}] #W #[fg=${surface2},bg=${bgcolor}]"

# Session persistence: auto-save only (manual restore — avoids clash with zshrc `default` session)
# Save:  Prefix+Ctrl-s  (with prefix C-s → press Ctrl-s, then Ctrl-s)
# Restore: Prefix+Ctrl-r (Ctrl-s, then Ctrl-r)
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-save-interval '15'
# set -g @continuum-restore 'on'  # enable later if you want auto-restore on tmux start

# tmux-yank configuration - use system clipboard
# Try xclip first (X11), then wl-copy (Wayland)
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'
# Auto-detect clipboard command
set -g @custom_copy_command 'xclip -selection clipboard 2>/dev/null || wl-copy 2>/dev/null || cat'
set -g @custom_paste_command 'xclip -selection clipboard -o 2>/dev/null || wl-paste 2>/dev/null || cat'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
