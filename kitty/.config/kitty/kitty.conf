# Kitty — soft noctalia green (aligned with starship/tmux)
# Stow package: from ~/.dotfiles run `stow kitty`

# Same monospace as GNOME (org.gnome.desktop.interface monospace-font-name)
font_family NotoMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0

# Browser-style font size shortcuts
map ctrl+plus  change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

window_padding_width 8
window_margin_width 0
confirm_os_window_close 0
hide_window_decorations yes

background_opacity 0.92
dynamic_background_opacity yes

cursor_shape beam
cursor_blink_interval 0
shell_integration enabled

scrollback_lines 10000
wheel_scroll_multiplier 3.0

enable_audio_bell no

clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
copy_on_select clipboard

# Soft noctalia-inspired palette
foreground #d8ddd9
background #1c1c1e
selection_foreground #1c1c1e
selection_background #8fbf98

color0  #1c1c1e
color8  #3a3b3e

color1  #ffb4ab
color9  #ffb4ab

color2  #8fbf98
color10 #a8d0b0

color3  #c6a26e
color11 #c6a26e

color4  #7a827c
color12 #9aa29c

color5  #6b8070
color13 #8fbf98

color6  #7a827c
color14 #8fbf98

color7  #d8ddd9
color15 #ffffff

cursor #8fbf98
cursor_text_color #1c1c1e
url_color #8fbf98
active_border_color #8fbf98
inactive_border_color #3a3b3e
active_tab_foreground #1c1c1e
active_tab_background #8fbf98
inactive_tab_foreground #d8ddd9
inactive_tab_background #2a2b2e
tab_bar_background #1c1c1e

# Keep Tabby for SSH; this profile is for local daily use
shell /usr/bin/zsh
