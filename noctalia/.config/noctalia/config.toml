# Configurazione noctalia condivisa (dotfiles).
# Gli override specifici della macchina stanno in
# ~/.local/state/noctalia/settings.toml, che ha la precedenza su questo file.

[accessibility]
ui_scale = 1.0

[bar.default]
start = [
    "launcher",
    "wallpaper",
    "workspaces"
]
end = [
    "media",
    "usage",
    "yuuto/arch-updater:widget",
    "tray",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
font_scale = 0.84999998845160007
font_weight = 400
thickness = 26

center = [ "clock", "notifications" ]

[brightness]
# luminosita' dei monitor esterni via DDC/CI (richiede ddcutil)
enable_ddcutil = true
sync_all_monitors = true

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
# le icone appuntate stanno nello stato locale: dipendono da cosa e'
# installato su questa macchina
enabled = false
reserve_space = false
show_dots = true
smart_auto_hide = true

show_instance_count = false
icon_size = 44

cross_axis_padding = 6

[lockscreen]
fingerprint = false

# Inattivita': blocco dopo 3 minuti, schermo spento a 4 (lo spegnimento deve
# restare piu' alto del blocco, cosi' avviene a sessione gia' bloccata).
# La sospensione resta spenta (idle.behavior.lock-and-suspend).
grace_period_seconds = 10

[idle.behavior.lock]
enabled = true
timeout = 180

[idle.behavior.screen-off]
enabled = true
timeout = 240

[plugin_settings."ayagmar/headroom"]
# bar_style e bar_accounts stavano qui fino alla 0.2; dalla 0.3 sono
# impostazioni del widget, cosi' due capsule sulla stessa barra possono
# mostrare cose diverse. Si trovano sotto [widget.usage].
provider_antigravity = "off"

notify = false
notify_reset_credits = false
warn_percent = 75

[plugin_settings."yuuto/arch-updater"]
# aur_check_cmd e update_cmd restano vuoti di proposito: il primo vale solo con
# aur_helper = "custom", il secondo scavalcherebbe ignore_packages e romperebbe
# l'aggiornamento in background, che dev'essere non interattivo.
aur_helper = "paru"
# il terminale unico: invece di aprire una kitty nuova, crea una sessione tmux
# in quella gia' aperta e le da' il focus
terminal = "/home/swolley/.config/niri/terminal.sh run"
auto_check_hours = 1
check_arch_news = false
flatpak_enabled = false
show_activity_graph = false
show_changelog_after_update = false
show_download_size = false

config_review = false

[plugins]
enabled = [
    "alexander/screen-toolkit",
    "yuuto/arch-updater",
    "icefish/phone-connect",
    "andrewdems/vpn-manager",
    "ayagmar/headroom"
]

[shell]
avatar_path = "/home/swolley/Scaricati/grafiche/swolley/DALL·E 2024-12-13 23.38.18 - A refined illustration of a microprocessor component with a black plastic casing and metallic pins surrounding it, placed on a sleek digital backgroun.webp"
button_borders = false
card_borders = false
date_format = "%A %d %B %Y"
font_family = "Adwaita Sans"
lang = "it"
niri_overview_close_on_launch_enabled = true
niri_overview_type_to_launch_enabled = true
# Agente polkit: risponde alle richieste di password di pkexec (FortiClient,
# gparted...). Prima lo faceva polkit-gnome, disinstallato con la pulizia:
# senza nessuno dei due quelle finestre non compaiono piu'.
polkit_agent = true

    # Il launcher fa da menu applicazioni: stretto, in elenco, con le
    # categorie come sole icone. Si apre al centro dello schermo, dalla lente
    # sulla barra o con Mod+D, che alla seconda pressione passa all'overview
    # delle finestre.

external_ip_enabled = true

    [shell.launcher]
    app_grid = false
    # categorie come sole icone: a questa larghezza le etichette si
    # troncherebbero e diventerebbero illeggibili.
    categories = true
    category_icons_only = true
    compact = true
    default_view = "all"
    fetch_exchange_rates = false
    layout = "simple"
    search_position = "top"
    show_icons = true
    sort_by_usage = false
    track_usage = false
    width = 520

    [shell.screenshot]
    confirm_region = true
    directory = "/home/swolley/Immagini/Schermate"
    remember_last_region = true

    [shell.window_switcher]
    mru = true

[theme]
builtin = "Eldritch"
community_palette = "Oxocarbon"
custom_palette = "adwaita-starship"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "niri", "qt" ]
    community_ids = [ "bat", "claude-code", "codex", "fzf", "inkscape", "lazygit", "obsidian", "pywalfox", "vscode" ]

    # Extra palette colors (the soft tones used by tmux, starship, kitty, nvim).
    # blend = false keeps the exact hue; templates read them as
    # colors.<name>_source.<mode>.hex. Other users: change them here.
    [theme.templates.custom_colors]
    soft_bg = { color = "#1c1c1e", blend = false }
    soft_fg = { color = "#d8ddd9", blend = false }
    soft_surface = { color = "#2a2b2e", blend = false }
    soft_surface2 = { color = "#3a3b3e", blend = false }
    soft_muted = { color = "#7a827c", blend = false }
    soft_urgent = { color = "#ffb4ab", blend = false }
    soft_yellow = { color = "#c6a26e", blend = false }
    soft_teal = { color = "#7eb8b0", blend = false }

    # tmux reads the generated file with source-file (see .tmux.conf).
    [theme.templates.user.tmux]
    input_path = "$XDG_CONFIG_HOME/noctalia/templates/tmux-colors.conf"
    output_path = "$XDG_CONFIG_HOME/tmux/noctalia-colors.conf"

    # starship reads a single file: noctalia generates the palette and the
    # script joins it with the prompt structure into ~/.config/starship.toml.
    [theme.templates.user.starship]
    input_path = "$XDG_CONFIG_HOME/noctalia/templates/starship-palette.toml"
    output_path = "$XDG_CACHE_HOME/noctalia/starship-palette.toml"
    post_hook = "sh '{{ config_dir }}/templates/starship-build.sh'"

[wallpaper]
fill_color = "#000000"

enabled = false

    [wallpaper.automation]
    enabled = true
    recursive = false

    [wallpaper.default]
    path = "/home/swolley/Immagini/swolley.jpg"

[widget.battery]
display_mode = "glyph"

hide_when_plugged = true

[widget.brightness]
enabled = false

[widget.clipboard]
enabled = false

[widget.control-center]
glyph = "adjustments"

[widget.media]
hide_when_no_media = true

[widget.network]
enabled = false

show_vpn_label = true

[widget.usage]
type = "ayagmar/headroom:usage"
# "full" (il valore di fabbrica) mette anche un anello di avanzamento accanto
# a ogni percentuale; "value" lascia solo logo e numero.
bar_style = "value"

[widget.volume]
enabled = false

[widget.wallpaper]
enabled = false
    # Barra a scomparsa solo sui monitor secondari; sull'LG (DP-2) resta fissa.

[notification]
# scala del riquadro, testo compreso: non esiste un font_size a parte
scale = 0.85

[audio]
enable_screenshot_sounds = false

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "andrewdems/vpn-manager:toggle"

[[control_center.shortcuts]]
type = "icefish/phone-connect:tile"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "audio"

[[control_center.shortcuts]]
type = "mic_mute"

[location]
auto_locate = true

[plugin_settings."alexander/screen-toolkit"]
hide-when-unused = true

panel-mode = "legacy"

[control_center]
sidebar = "full"
sidebar_section = "full"
width = 800

[shell.panel]
# Il launcher si apre al centro dello schermo, non appeso alla barra: ci si
# scrive dentro e conviene averlo sott'occhio invece che in un angolo.
launcher_placement = "floating"
launcher_position = "center"
open_near_click_control_center = true
open_near_click_launcher = false

[widget.clock]
format = "{:%a %d %b %Y  %H:%M}"
type = "clock"

[widget."yuuto/arch-updater:widget"]
glyph = "rocket"
type = "yuuto/arch-updater:widget"

hide_on_empty = true

[calendar]
dedupe_events = true
enabled = true

    [calendar.account.personal_google]
    type = "google"

# Nella barra i workspace si leggono col loro numero: "name" mostrerebbe il
# nome, che qui nessun workspace ha.

[widget.workspaces]
label_source = "id"

[battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
warning_threshold = 10

[widget.bar]
type = "andrewdems/vpn-manager:bar"

[widget.notifications]
hide_when_no_unread = true

[bluetooth]
connect_when_enabled = true
connection_notifications = true

[widget.bluetooth]
enabled = false
hide_when_adapter_off = true
hide_when_no_connected_device = true

[widget.phone]
type = "icefish/phone-connect:bar"

enabled = false

[plugin_settings."icefish/phone-connect"]
enable_charging_animation = false

# Durata dei toast. noctalia non ha un'impostazione globale: la durata la
# decide chi manda la notifica, e l'unico modo per scavalcarla e' un filtro.
# match_content e' una regex sul testo, e ".*" prende tutto; con match = ""
# invece non si aggancia niente. I cinque secondi di prima erano troppi.

[notification.filter.tutte]
match_content = ".*"
override_duration = 3000

# Le notifiche di Claude e di Laravel Mix compaiono ma non finiscono nella
# cronologia. La regex e' sul testo della notifica e racchiusa in ".*" cosi'
# funziona sia come ricerca sia come corrispondenza intera. Il filtro ripete
# la durata di "tutte" perche' non e' detto che i due si sommino.

[notification.filter.senza-cronologia]
match_content = ".*([Cc]laude|[Ll]aravel [Mm]ix).*"
save_history = false
override_duration = 3000

# Manda sfondo, palette e disposizione dei monitor a noctalia-greeter a ogni
# cambio di tema, cosi' la schermata di accesso non resta indietro. Serve
# un'autorizzazione: scrive in /var/lib/noctalia-greeter.

[shell.greeter_sync]
auto_sync = true

[widget.tray]
match_adjacent_spacing = true
