# Shared noctalia configuration (dotfiles).
# Machine-specific overrides live in
# ~/.local/state/noctalia/settings.toml, which takes precedence over this file.

[accessibility]
ui_scale = 1.0

[bar.default]
start = [
    "launcher",
    "wallpaper",
    "workspaces"
]
end = [
    "media",
    "usage",
    "yuuto/arch-updater:widget",
    "tray",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
font_scale = 0.84999998845160007
font_weight = 400
thickness = 26

center = [ "clock", "notifications" ]

[brightness]
# brightness of external monitors via DDC/CI (requires ddcutil)
enable_ddcutil = true
sync_all_monitors = true

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
# pinned icons live in the local state: they depend on what is
# installed on this machine
enabled = false
reserve_space = false
show_dots = true
smart_auto_hide = true

show_instance_count = false
icon_size = 44

cross_axis_padding = 6

[lockscreen]
fingerprint = false
# Fade only, on lock and on unlock (by default it picks one at random).
transition = ["fade"]
transition_duration = 400

# Inactivity: lock after 3 minutes, screen off at 4 (the screen-off timeout
# must stay higher than the lock one, so it happens with the session already
# locked). Suspend stays off (idle.behavior.lock-and-suspend).
# No grace period: with a value > 0 any key unlocks without a password for
# that many seconds after locking.
grace_period_seconds = 0
# Lock before every suspend (suspend key, lid close, systemctl suspend),
# even when it is logind that suspends and not noctalia.
lock_before_suspend = true

[idle.behavior.lock]
enabled = true
timeout = 180

[idle.behavior.screen-off]
enabled = true
timeout = 240

[plugin_settings."ayagmar/headroom"]
# bar_style and bar_accounts were here up to 0.2; since 0.3 they are widget
# settings, so two capsules on the same bar can show different things. They
# are found under [widget.usage].
provider_antigravity = "off"

notify = false
notify_reset_credits = false
warn_percent = 75

[plugin_settings."yuuto/arch-updater"]
# aur_check_cmd and update_cmd are left empty on purpose: the first only
# applies with aur_helper = "custom", the second would override
# ignore_packages and break the background update, which must be
# non-interactive.
aur_helper = "paru"
# terminal = ... is in 91-user.local.toml: it needs the absolute path of the
# niri/terminal.sh script, which depends on the home.
auto_check_hours = 1
check_arch_news = false
flatpak_enabled = false
show_activity_graph = false
show_changelog_after_update = false
show_download_size = false

config_review = false

# Personal preference kept here temporarily (community plugin list); final
# decision (move to a local/override file or keep as default) deferred.
[plugins]
enabled = [
    "alexander/screen-toolkit",
    "yuuto/arch-updater",
    "icefish/phone-connect",
    "andrewdems/vpn-manager",
    "ayagmar/headroom"
]

[shell]
button_borders = false
card_borders = false
date_format = "%A %d %B %Y"
font_family = "Adwaita Sans"
# Personal preference kept here temporarily; final decision (move to a
# local/override file or keep as default) deferred.
lang = "it"
niri_overview_close_on_launch_enabled = true
niri_overview_type_to_launch_enabled = true
# Personal preference kept here temporarily; final decision (move to a
# local/override file or keep as default) deferred.
# Polkit agent: answers pkexec password requests (FortiClient, gparted...).
# polkit-gnome used to do it, but it was uninstalled in the cleanup: with
# neither of the two, those windows no longer appear.
polkit_agent = true

    # The launcher acts as the applications menu: narrow, as a list, with
    # categories as icons only. It opens in the center of the screen, from the
    # magnifier on the bar or with Mod+D, which on the second press switches
    # to the window overview.

external_ip_enabled = true

    [shell.launcher]
    app_grid = false
    # categories as icons only: at this width the labels would be truncated
    # and become unreadable.
    categories = true
    category_icons_only = true
    compact = true
    default_view = "all"
    fetch_exchange_rates = false
    layout = "simple"
    search_position = "top"
    show_icons = true
    sort_by_usage = false
    track_usage = false
    width = 520

    [shell.screenshot]
    confirm_region = true
    remember_last_region = true

    [shell.window_switcher]
    mru = true

[theme]
builtin = "Eldritch"
community_palette = "Oxocarbon"
custom_palette = "adwaita-starship"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "niri", "qt" ]
    # Personal preference kept here temporarily (community template list);
    # final decision (move to a local/override file or keep as default)
    # deferred.
    community_ids = [ "bat", "claude-code", "codex", "fzf", "inkscape", "lazygit", "pywalfox", "vscode" ]

    # Extra palette colors (the soft tones used by tmux, starship, kitty, nvim).
    # blend = false keeps the exact hue; templates read them as
    # colors.<name>_source.<mode>.hex. Other users: change them here.
    [theme.templates.custom_colors]
    soft_bg = { color = "#1c1c1e", blend = false }
    soft_fg = { color = "#d8ddd9", blend = false }
    soft_surface = { color = "#2a2b2e", blend = false }
    soft_surface2 = { color = "#3a3b3e", blend = false }
    soft_muted = { color = "#7a827c", blend = false }
    soft_urgent = { color = "#ffb4ab", blend = false }
    soft_yellow = { color = "#c6a26e", blend = false }
    soft_teal = { color = "#7eb8b0", blend = false }
    soft_accent_dim = { color = "#6b8070", blend = false }
    soft_rose = { color = "#c4a7a0", blend = false }

    # ANSI colors of the terminal (kitty). Normal 1-6 stay dark enough to carry
    # white text: programs use them as backgrounds (Symfony, Laravel badges).
    ansi_red = { color = "#c01c28", blend = false }
    ansi_red_bright = { color = "#ff7b63", blend = false }
    ansi_green_bright = { color = "#a8d0b0", blend = false }
    ansi_yellow = { color = "#a9762f", blend = false }
    ansi_yellow_bright = { color = "#e0bb8a", blend = false }
    ansi_blue = { color = "#2b5ea7", blend = false }
    ansi_blue_bright = { color = "#62a0ea", blend = false }
    ansi_magenta = { color = "#7d4b94", blend = false }
    ansi_magenta_bright = { color = "#c061cb", blend = false }
    ansi_cyan = { color = "#1d7f91", blend = false }
    ansi_cyan_bright = { color = "#4dbdd4", blend = false }
    ansi_white_bright = { color = "#ffffff", blend = false }

    # tmux reads the generated file with source-file (see .tmux.conf).
    [theme.templates.user.tmux]
    input_path = "$XDG_CONFIG_HOME/noctalia/templates/tmux-colors.conf"
    output_path = "$XDG_CONFIG_HOME/tmux/noctalia-colors.conf"

    # kitty includes the generated file (see kitty.conf); SIGUSR1 reloads the
    # open windows.
    [theme.templates.user.kitty]
    input_path = "$XDG_CONFIG_HOME/noctalia/templates/kitty-colors.conf"
    output_path = "$XDG_CONFIG_HOME/kitty/noctalia-colors.conf"
    post_hook = "pkill -USR1 -x kitty || true"

    # Neovim: the palette module loads the generated file from the cache and
    # falls back to its own values (nvim/.config/nvim/lua/noctalia/palette.lua).
    [theme.templates.user.nvim]
    input_path = "$XDG_CONFIG_HOME/noctalia/templates/nvim-palette.lua"
    output_path = "$XDG_CACHE_HOME/noctalia/nvim-palette.lua"

    # gitmux has no include: noctalia writes the whole config to the cache and
    # tmux.conf prefers it over ~/.gitmux.conf (the fallback in the dotfiles).
    [theme.templates.user.gitmux]
    input_path = "$XDG_CONFIG_HOME/noctalia/templates/gitmux.conf"
    output_path = "$XDG_CACHE_HOME/noctalia/gitmux.conf"

    # KDE apps read their colors from kdeglobals, not from qt6ct: while it was
    # hand-written it fell behind at every theme change. The file is fully
    # generated, so ~/.config/kdeglobals is no longer a link to the repo (it
    # would overwrite it); only the template lives in the repo.
    [theme.templates.user.kdeglobals]
    input_path = "$XDG_CONFIG_HOME/noctalia/templates/kdeglobals"
    output_path = "$XDG_CONFIG_HOME/kdeglobals"
    # noctalia recognizes this output and, with the action, notifies the KDE
    # apps already open that the palette changed: they recolor without being
    # reopened.
    post_action = "kde-color-scheme"

    # starship reads a single file: noctalia generates the palette and the
    # script joins it with the prompt structure into ~/.config/starship.toml.
    [theme.templates.user.starship]
    input_path = "$XDG_CONFIG_HOME/noctalia/templates/starship-palette.toml"
    output_path = "$XDG_CACHE_HOME/noctalia/starship-palette.toml"
    post_hook = "sh '{{ config_dir }}/templates/starship-build.sh'"

[wallpaper]
fill_color = "#000000"

enabled = false

    [wallpaper.automation]
    enabled = true
    recursive = false

    [wallpaper.default]

[widget.battery]
display_mode = "glyph"

hide_when_plugged = true

[widget.brightness]
enabled = false

[widget.clipboard]
enabled = false

[widget.control-center]
glyph = "adjustments"

[widget.media]
hide_when_no_media = true

[widget.network]
enabled = false

show_vpn_label = true

[widget.usage]
type = "ayagmar/headroom:usage"
# "full" (the factory value) also puts a progress ring next to each
# percentage; "value" leaves only the logo and the number.
bar_style = "value"

[widget.volume]
enabled = false

[widget.wallpaper]
enabled = false
    # Auto-hiding bar only on the secondary monitors; on the LG (DP-2) it stays fixed.

[notification]
# scale of the popup, text included: there is no separate font_size
scale = 0.85

# Personal preference kept here temporarily (Claude / Laravel Mix filters);
# final decision (move to a local/override file or keep as default) deferred.
# The filters at the bottom of the file are read in this order and the first
# one that matches wins: the others are not even looked at. The order must be
# written by hand, because without filter_order noctalia makes one up and
# "tutte", which always matches, ended up ahead of the others and cancelled
# them. The two specific ones go first, the catch-all last.
filter_order = [ "claude", "laravel-mix", "tutte" ]

[audio]
enable_screenshot_sounds = false

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "andrewdems/vpn-manager:toggle"

[[control_center.shortcuts]]
type = "icefish/phone-connect:tile"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "audio"

[[control_center.shortcuts]]
type = "mic_mute"

[location]
auto_locate = true

[plugin_settings."alexander/screen-toolkit"]
hide-when-unused = true

panel-mode = "legacy"

[control_center]
sidebar = "full"
sidebar_section = "full"
width = 800

[shell.panel]
# The launcher opens in the center of the screen, not attached to the bar:
# you type into it and it is better to have it in front of you than in a
# corner.
launcher_placement = "floating"
launcher_position = "center"
open_near_click_control_center = true
open_near_click_launcher = false

[widget.clock]
format = "{:%a %d %b %Y  %H:%M}"
type = "clock"

[widget."yuuto/arch-updater:widget"]
glyph = "rocket"
type = "yuuto/arch-updater:widget"

hide_on_empty = true

[calendar]
dedupe_events = true
enabled = true

    [calendar.account.personal_google]
    type = "google"

# On the bar the workspaces are read by their number: "name" would show the
# name, which no workspace has here.

[widget.workspaces]
label_source = "id"

[battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
warning_threshold = 10

[widget.bar]
type = "andrewdems/vpn-manager:bar"

[widget.notifications]
hide_when_no_unread = true

[bluetooth]
connect_when_enabled = true
connection_notifications = true

[widget.bluetooth]
enabled = false
hide_when_adapter_off = true
hide_when_no_connected_device = true

[widget.phone]
type = "icefish/phone-connect:bar"

enabled = false

[plugin_settings."icefish/phone-connect"]
enable_charging_animation = false

# Personal preference kept here temporarily (Claude / Laravel Mix filters);
# final decision (move to a local/override file or keep as default) deferred.
# Claude Code and Laravel Mix notifications show up as toasts but do not end
# up in the history: they are momentary alerts, reopening them from the
# drawer is pointless. They repeat the duration of "tutte" because, when they
# win, that filter is not applied.
#
# Claude is matched with match, which looks at the application name (here
# "Claude") and not at the text: the title and body change with every alert
# and the word "Claude" is not necessarily there.
[notification.filter.claude]
match = "claude"
save_history = false
override_duration = 3000

# Laravel Mix, on the other hand, notifies through node, so it cannot be
# recognized by the application name: the regex on the text remains,
# wrapped in ".*" so it works both as a search and as a full match.
[notification.filter.laravel-mix]
match_content = ".*[Ll]aravel [Mm]ix.*"
save_history = false
override_duration = 3000

# Toast duration. noctalia has no global setting: the duration is decided by
# whoever sends the notification, and the only way to override it is a
# filter. match_content is a regex on the text, and ".*" catches everything;
# with match = "" instead nothing gets hooked. The previous five seconds were
# too many.
[notification.filter.tutte]
match_content = ".*"
override_duration = 3000

# Sends the wallpaper, palette and monitor layout to noctalia-greeter at
# every theme change, so the login screen does not fall behind. It needs an
# authorization: it writes to /var/lib/noctalia-greeter.

[shell.greeter_sync]
auto_sync = true

[widget.tray]
match_adjacent_spacing = true
