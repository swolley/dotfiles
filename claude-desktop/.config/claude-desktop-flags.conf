# Chromium picks where to keep secrets by looking at XDG_CURRENT_DESKTOP. Under
# gnome it used gnome-libsecret; it does not know "niri", so it falls back to
# basic_text, i.e. no keyring: safeStorage reports itself as unavailable and
# the access tokens are not saved. As a result, the session dies every time
# the application is closed.
#
# By pointing it to the keyring by hand, it goes back to writing to the
# "Chromium Safe Storage" entry with application=Claude that it already has in
# the keyring.
--password-store=gnome-libsecret
