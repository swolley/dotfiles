# Chromium sceglie dove tenere i segreti guardando XDG_CURRENT_DESKTOP. Sotto
# gnome prendeva gnome-libsecret; "niri" non lo conosce, quindi ripiega su
# basic_text, cioe' nessun portachiavi: safeStorage si dichiara indisponibile
# e i token di accesso non vengono salvati. Risultato, la sessione muore a
# ogni chiusura dell'applicazione.
#
# Indicandogli il portachiavi a mano, torna a scrivere nella voce
# "Chromium Safe Storage" con application=Claude che ha gia' nel portachiavi.
--password-store=gnome-libsecret
